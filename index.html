<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Monologue Library</title>
<style>
:root{--paper:#F4F5F7;--sheet:#fff;--ink:#1C2533;--muted:#4A5565;--rule:#CDD3DB;--claret:#7A1F3D;--claret-dark:#5B1630;--err:#9B1C1C;--focus:#0A58CA}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:1.05rem/1.5 "Segoe UI","Helvetica Neue",Arial,sans-serif;padding:16px}
form{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:2rem;width:100%;max-width:24rem}
h1{font:700 1.5rem/1.2 "Palatino Linotype",Palatino,Georgia,serif;margin:0 0 .25rem}
p{color:var(--muted);margin:0 0 1.25rem;font-size:.95rem}
label{display:block;font-weight:600;margin-bottom:.35rem}
input{width:100%;font:inherit;padding:.6rem .7rem;border:1px solid #8892A0;border-radius:6px}
button{margin-top:1rem;width:100%;font:600 1rem inherit;font-family:inherit;padding:.7rem;border:0;border-radius:6px;background:var(--claret);color:#fff;cursor:pointer}
button:hover{background:var(--claret-dark)} button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.msg{min-height:1.5em;margin-top:.75rem;font-size:.95rem}
.msg.err{color:var(--err)}
</style>
</head>

<script>
// Payload = base64(openssl enc -aes-256-cbc -pbkdf2 -md sha256 -iter N -salt) of gzip(site HTML).
const ITER = 600000, KEY = "monolib-pw";
const $ = id => document.getElementById(id);
async function unlock(pw) {
  const raw = Uint8Array.from(atob($("payload").textContent.trim()), c => c.charCodeAt(0));
  const salt = raw.slice(8, 16), data = raw.slice(16);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256"}, base, 384));
  const key = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({name: "AES-CBC", iv: bits.slice(32, 48)}, key, data);   // throws on a wrong password
  const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  try { sessionStorage.setItem(KEY, pw); } catch (e) {}
  document.open(); document.write(html); document.close();
}
async function attempt(pw, quiet) {
  $("go").disabled = true; $("msg").className = "msg"; $("msg").textContent = "Opening…";
  try { await unlock(pw); }
  catch (e) {
    try { sessionStorage.removeItem(KEY); } catch (e2) {}
    $("go").disabled = false; $("msg").className = quiet ? "msg" : "msg err";
    $("msg").textContent = quiet ? "" : "That password didn't work. Try again.";
  }
}
$("f").addEventListener("submit", e => { e.preventDefault(); attempt($("pw").value, false); });
let saved = null; try { saved = sessionStorage.getItem(KEY); } catch (e) {}
if (saved) attempt(saved, true);
</script>
